function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='style'&&typeof v==='object'){Object.assign(e.style,v);}
    else if(k.startsWith('on')&&typeof v==='function'){e.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==='class'){e.className=v;}
    else if(k==='html'){e.innerHTML=v;}
    else{e.setAttribute(k,v);}
  }
  for(const c of children){
    if(c==null||c===false)continue;
    if(typeof c==='string'||typeof c==='number'){e.appendChild(document.createTextNode(c));}
    else if(c instanceof Node){e.appendChild(c);}
  }
  return e;
}

function mapleLeaf(size=24,color=C.red,spin=false){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',size);svg.setAttribute('height',size);svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('fill',color);
  if(spin)svg.style.animation='leafSpin 3s linear infinite';
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d','M50 5 L56 35 L85 20 L68 45 L95 50 L68 55 L85 80 L56 65 L50 95 L44 65 L15 80 L32 55 L5 50 L32 45 L15 20 L44 35 Z');
  svg.appendChild(path);
  return svg;
}

function renderAccordionPage(title, icon, subtitle, sections, introText) {
  let openIndex=null;
  const wrap=el('div',{style:{maxWidth:860,margin:'0 auto',padding:'32px 16px'}});
  const hdr=el('div',{style:{textAlign:'center',marginBottom:32}});
  hdr.appendChild(el('div',{style:{fontSize:44,marginBottom:8}},icon));
  hdr.appendChild(el('h1',{style:{fontFamily:"'Playfair Display',serif",fontSize:36,color:C.navy,marginBottom:8}},title));
  if(subtitle)hdr.appendChild(el('p',{style:{color:C.grey,fontSize:16}},subtitle));
  wrap.appendChild(hdr);
  if(introText){
    const intro=el('div',{style:{background:'linear-gradient(90deg,'+C.navy+','+C.navyMid+')',borderRadius:12,padding:'16px 20px',marginBottom:20}});
    intro.appendChild(el('p',{style:{color:C.white,fontSize:14,lineHeight:1.7},html:introText}));
    wrap.appendChild(intro);
  }
  sections.forEach((sec,i)=>{
    const card=el('div',{style:{background:C.white,borderRadius:14,marginBottom:12,border:'1px solid '+C.greyLight,overflow:'hidden'}});
    const header=el('div',{style:{padding:'16px 20px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',background:openIndex===i?(sec.color||C.navy):C.white}});
    header.appendChild(el('span',{style:{fontSize:22}},sec.icon||''));
    header.appendChild(el('span',{style:{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,flex:1,color:openIndex===i?C.white:C.navy}},sec.title));
    header.appendChild(el('span',{style:{color:openIndex===i?C.white:C.grey,fontSize:20}},openIndex===i?'−':'+'));
    let body=null;
    header.addEventListener('click',()=>{
      openIndex=openIndex===i?null:i;
      render();
    });
    card.appendChild(header);
    if(openIndex===i){
      body=el('div',{class:'fade-up',style:{padding:'16px 20px'}});
      (sec.content||sec.items||[]).forEach((item,j)=>{
        const itemDiv=el('div',{style:{marginBottom:14,paddingBottom:14,borderBottom:j<(sec.content||sec.items).length-1?'1px solid '+C.greyLight:'none'}});
        if(item.h)itemDiv.appendChild(el('h4',{style:{color:sec.color||C.red,fontSize:14,fontWeight:700,marginBottom:4}},item.h));
        if(item.b)itemDiv.appendChild(el('p',{style:{color:C.navyMid,fontSize:14,lineHeight:1.65}},item.b));
        if(typeof item==='string')itemDiv.appendChild(el('p',{style:{color:C.navyMid,fontSize:14,lineHeight:1.65}},item));
        body.appendChild(itemDiv);
      });
      if(sec.content_text)body.appendChild(el('p',{style:{color:C.navyMid,fontSize:14,lineHeight:1.7}},sec.content_text));
      card.appendChild(body);
    }
    wrap.appendChild(card);
  });
  return wrap;
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function renderQuiz(questions, onFinish, title) {
  if(!quizState || quizState.questions!==questions){
    if(quizState && quizState.timerInterval) clearInterval(quizState.timerInterval);
    quizState={questions,idx:0,selected:null,answers:{},done:false,title,timerStart:null,timerInterval:null};
  }
  const s=quizState;
  if(s.done){
    if(s.timerInterval){ clearInterval(s.timerInterval); s.timerInterval=null; }
    const total=s.questions.length;
    const correct=s.questions.filter((q,i)=>s.answers[i]===q.answer).length;
    const pct=Math.round((correct/total)*100);
    const pass=pct>=75;
    const byCat={};
    s.questions.forEach((q,i)=>{
      if(!byCat[q.category])byCat[q.category]={correct:0,total:0};
      byCat[q.category].total++;
      if(s.answers[i]===q.answer)byCat[q.category].correct++;
    });
    const wrap=el('div',{style:{maxWidth:800,margin:'0 auto',padding:'24px 16px'}});
    const scoreCard=el('div',{class:'fade-up',style:{background:C.white,borderRadius:16,padding:'32px',textAlign:'center',marginBottom:20}});
    scoreCard.appendChild(el('div',{style:{fontSize:52,marginBottom:12}},pass?'🎉':'📚'));
    if(s.timerExpired) scoreCard.appendChild(el('div',{style:{background:C.redLight,color:C.red,borderRadius:8,padding:'8px 16px',fontWeight:700,fontSize:14,marginBottom:12}},'⏱ Time is up! The 45-minute exam time has ended.'));
    scoreCard.appendChild(el('h2',{style:{fontFamily:"'Playfair Display',serif",fontSize:32,color:C.navy,marginBottom:8}},pass?'Great Work!':'Keep Studying!'));
    scoreCard.appendChild(el('div',{style:{fontSize:60,fontFamily:"'Playfair Display',serif",color:pass?C.green:C.red,fontWeight:700,marginBottom:4}},pct+'%'));
    scoreCard.appendChild(el('div',{style:{fontSize:15,color:C.grey,marginBottom:12}},`${correct} of ${total} correct`));
    const verdict=el('div',{style:{background:pass?C.greenLight:C.redLight,borderRadius:10,padding:'12px 16px',display:'inline-block',marginBottom:20}});
    verdict.appendChild(el('span',{style:{color:pass?C.green:C.red,fontWeight:700,fontSize:15}},pass?"✓ You'd likely pass the citizenship test!":"✗ Aim for 75%+ — keep reviewing!"));
    scoreCard.appendChild(verdict);
    scoreCard.appendChild(el('button',{style:{background:C.navy,color:C.white,border:'none',padding:'12px 28px',borderRadius:10,fontSize:15,fontWeight:600,cursor:'pointer',display:'block',margin:'0 auto'},onClick:onFinish},'← Try Again'));
    wrap.appendChild(scoreCard);
    // Category breakdown
    if(Object.keys(byCat).length>1){
      const catDiv=el('div',{style:{marginBottom:20}});
      catDiv.appendChild(el('h3',{style:{fontFamily:"'Playfair Display',serif",fontSize:20,color:C.navy,marginBottom:12}},'Performance by Category'));
      const catGrid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12}});
      Object.entries(byCat).forEach(([cat,d])=>{
        const cp=Math.round((d.correct/d.total)*100);
        const c=el('div',{style:{background:C.white,borderRadius:12,padding:'14px',border:'1px solid '+C.greyLight}});
        c.appendChild(el('div',{style:{fontSize:11,color:C.grey,fontWeight:700,marginBottom:4}},cat.toUpperCase()));
        c.appendChild(el('div',{style:{fontFamily:"'Playfair Display',serif",fontSize:22,color:cp>=75?C.green:C.red,fontWeight:700}},cp+'%'));
        c.appendChild(el('div',{style:{fontSize:12,color:C.grey}},`${d.correct}/${d.total}`));
        const bar=el('div',{style:{background:C.greyLight,borderRadius:4,height:5,marginTop:8}});
        const fill=el('div',{style:{background:cp>=75?C.green:C.red,height:'100%',borderRadius:4,width:cp+'%'}});
        bar.appendChild(fill);c.appendChild(bar);
        catGrid.appendChild(c);
      });
      catDiv.appendChild(catGrid);wrap.appendChild(catDiv);
    }
    // Review answers
    const reviewDiv=el('div');
    reviewDiv.appendChild(el('h3',{style:{fontFamily:"'Playfair Display',serif",fontSize:20,color:C.navy,marginBottom:12}},'Answer Review'));
    s.questions.forEach((q,i)=>{
      const chosen=s.answers[i];
      const isCorrect=chosen===q.answer;
      const card=el('div',{class:'fade-up',style:{background:C.white,borderRadius:12,padding:'16px',marginBottom:10,border:'2px solid '+(isCorrect?C.green:C.red)}});
      const top=el('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}});
      top.appendChild(el('div',{style:{fontSize:11,color:C.grey,fontWeight:700}},q.category.toUpperCase()));
      top.appendChild(el('span',{style:{fontSize:13,fontWeight:700,color:isCorrect?C.green:C.red}},isCorrect?'✓ Correct':'✗ Wrong'));
      card.appendChild(top);
      card.appendChild(el('p',{style:{fontWeight:700,color:C.navy,fontSize:13,marginBottom:6,lineHeight:1.4}},q.q));
      if(!isCorrect&&chosen!==undefined)card.appendChild(el('p',{style:{color:C.red,fontSize:13,marginBottom:4}},`Your answer: ${q.options[chosen]}`));
      if(!isCorrect&&chosen===undefined)card.appendChild(el('p',{style:{color:C.grey,fontSize:13,marginBottom:4}},'Not answered'));
      card.appendChild(el('p',{style:{color:C.green,fontSize:13,fontWeight:600}},`✓ Correct: ${q.options[q.answer]}`));
      reviewDiv.appendChild(card);
    });
    wrap.appendChild(reviewDiv);
    return wrap;
  }
  // Active question
  const q=s.questions[s.idx];
  const prog=(s.idx/s.questions.length)*100;

  // ── TIMER SETUP ──
  const totalSeconds = 45 * 60; // 45 minutes like real exam
  if(!s.timerStart) s.timerStart = Date.now();
  if(!s.timerInterval){
    s.timerInterval = setInterval(()=>{
      const elapsed = Math.floor((Date.now() - s.timerStart) / 1000);
      const remaining = totalSeconds - elapsed;
      if(remaining <= 0){
        clearInterval(s.timerInterval);
        s.done = true;
        s.timerExpired = true;
        render();
        return;
      }
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      const timerEl = document.getElementById('quiz-timer');
      if(timerEl){
        timerEl.textContent = `⏱ ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        if(remaining <= 300) timerEl.style.color = C.red; // red when 5 mins left
        if(remaining <= 60) timerEl.style.animation = 'fadeUp 0.5s infinite alternate'; // flash when 1 min left
      }
    }, 1000);
  }
  const elapsed = Math.floor((Date.now() - s.timerStart) / 1000);
  const remaining = Math.max(0, totalSeconds - elapsed);
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const timerColor = remaining <= 300 ? C.red : C.green;

  const wrap=el('div',{style:{maxWidth:720,margin:'0 auto',padding:'20px 16px'}});
  const topRow=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}});
  topRow.appendChild(el('span',{style:{fontSize:12,color:C.grey,fontWeight:700}},s.title));

  // Timer + question counter row
  const rightRow = el('div',{style:{display:'flex',alignItems:'center',gap:12}});
  const timerBadge = el('span',{
    id:'quiz-timer',
    style:{background:remaining<=300?C.redLight:C.greenLight,color:timerColor,borderRadius:8,padding:'4px 12px',fontSize:14,fontWeight:700,fontFamily:'monospace'}
  }, `⏱ ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`);
  const counterBadge = el('span',{style:{background:C.redLight,color:C.red,borderRadius:8,padding:'4px 12px',fontSize:14,fontWeight:700}},`${s.idx+1} / ${s.questions.length}`);
  rightRow.appendChild(timerBadge);
  rightRow.appendChild(counterBadge);
  topRow.appendChild(rightRow);
  wrap.appendChild(topRow);
  const progBar=el('div',{style:{background:C.greyLight,borderRadius:4,height:6,marginBottom:20}});
  progBar.appendChild(el('div',{style:{background:C.red,height:'100%',borderRadius:4,width:prog+'%',transition:'width 0.3s'}}));
  wrap.appendChild(progBar);
  const card=el('div',{class:'fade-up',style:{background:C.white,borderRadius:16,padding:'28px 22px',boxShadow:'0 4px 24px rgba(10,22,40,0.08)'}});
  card.appendChild(el('div',{style:{fontSize:11,color:C.grey,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:12}},q.category));
  card.appendChild(el('h2',{style:{fontFamily:"'Playfair Display',serif",fontSize:20,color:C.navy,marginBottom:20,lineHeight:1.4}},q.q));
  const opts=el('div',{style:{display:'flex',flexDirection:'column',gap:10}});
  q.options.forEach((opt,i)=>{
    let bg=C.white,border='2px solid '+C.greyLight,color=C.navy;
    if(s.selected!==null){
      if(i===q.answer){bg=C.greenLight;border='2px solid '+C.green;color=C.green;}
      else if(i===s.selected&&i!==q.answer){bg=C.redLight;border='2px solid '+C.red;color=C.red;}
    }
    const btn=el('button',{class:'opt-btn',style:{background:bg,border,color,fontFamily:'inherit',fontSize:15},onClick:()=>{
      if(s.selected!==null)return;
      s.selected=i;s.answers[s.idx]=i;
      render();
    }});
    const circle=el('span',{style:{width:24,height:24,borderRadius:'50%',background:s.selected===null?C.greyLight:(i===q.answer?C.green:i===s.selected?C.red:C.greyLight),color:s.selected===null?C.grey:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}},['A','B','C','D'][i]);
    btn.appendChild(circle);
    btn.appendChild(document.createTextNode(opt));
    opts.appendChild(btn);
  });
  card.appendChild(opts);
  if(s.selected!==null){
    const feedback=el('div',{style:{marginTop:20,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}});
    feedback.appendChild(el('span',{style:{fontSize:14,fontWeight:700,color:s.selected===q.answer?C.green:C.red}},s.selected===q.answer?'✓ Correct!':'✗ Correct: '+q.options[q.answer]));
    const next=el('button',{style:{background:C.navy,color:C.white,border:'none',padding:'10px 24px',borderRadius:10,fontSize:15,fontWeight:600,cursor:'pointer'},onClick:()=>{
      if(s.idx+1>=s.questions.length){s.done=true;}
      else{s.idx++;s.selected=null;}
      render();
    }},s.idx+1>=s.questions.length?'See Results →':'Next →');
    feedback.appendChild(next);
    card.appendChild(feedback);
  }
  wrap.appendChild(card);
  return wrap;
}

// ─── PRACTICE PAGE ───────────────────────────────────────────────────────────
let practiceState={step:'category',selectedCat:null,selectedProvince:'all',selectedSize:null,questions:null};

function renderPractice() {
  const ps=practiceState;
  function getPool(){
    let pool=ps.selectedCat==='All'?ALL_QUESTIONS:ALL_QUESTIONS.filter(q=>q.category===ps.selectedCat);
    if(ps.selectedProvince!=='all'){
      const ids=PROVINCE_QUESTIONS[ps.selectedProvince]||[];
      const idSet=new Set(ids);
      const base=pool.filter(q=>idSet.has(q.id));
      const rest=pool.filter(q=>!idSet.has(q.id));
      pool=[...base,...rest];
    }
    return pool;
  }
  if(ps.step==='quiz'&&ps.questions){
    const provLabel=ps.selectedProvince!=='all'?` · ${PROVINCES.find(p=>p.id===ps.selectedProvince)?.name}`:'';
    const sizeLabel=ps.selectedSize===226?'All 226':`${ps.selectedSize} Qs`;
    return renderQuiz(ps.questions,()=>{quizState=null;practiceState={step:'category',selectedCat:null,selectedProvince:'all',selectedSize:null,questions:null};render();},`${ps.selectedCat}${provLabel} · ${sizeLabel}`);
  }
  const wrap=el('div',{style:{maxWidth:900,margin:'0 auto',padding:'32px 16px'}});
  // Breadcrumb
  const bc=el('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:24,fontSize:13,flexWrap:'wrap'}});
  const steps2=['Category','Province','Length','Quiz'];
  const stepIdx=['category','province','size','quiz'].indexOf(ps.step);
  steps2.forEach((label,i)=>{
    if(i>0)bc.appendChild(el('span',{style:{color:C.greyLight}},'›'));
    bc.appendChild(el('span',{style:{color:i===stepIdx?C.red:i<stepIdx?C.navy:C.grey,fontWeight:i<=stepIdx?700:400,cursor:i<stepIdx?'pointer':'default'},onClick:()=>{if(i===0&&stepIdx>0){practiceState.step='category';render();}else if(i===1&&stepIdx>1){practiceState.step='province';render();}else if(i===2&&stepIdx>2){practiceState.step='size';render();}}},label));
  });
  wrap.appendChild(bc);
  if(ps.step==='category'){
    wrap.appendChild(el('h1',{style:{fontFamily:"'Playfair Display',serif",fontSize:30,color:C.navy,marginBottom:8}},'Practice Tests'));
    wrap.appendChild(el('p',{style:{color:C.grey,fontSize:15,marginBottom:20}},'Step 1: Select the category you want to practice.'));
    const grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))',gap:16}});
    CATEGORIES.forEach(cat=>{
      const guide=STUDY_GUIDE.find(g=>g.title===cat);
      const count=cat==='All'?ALL_QUESTIONS.length:ALL_QUESTIONS.filter(q=>q.category===cat).length;
      const card=el('div',{class:'card-hover',style:{background:C.white,borderRadius:14,padding:'20px',border:'1px solid '+C.greyLight,cursor:'pointer'},onClick:()=>{practiceState.selectedCat=cat;practiceState.step='province';render();}});
      card.appendChild(el('div',{style:{fontSize:28,marginBottom:8}},guide?.icon||'📋'));
      card.appendChild(el('h3',{style:{fontFamily:"'Playfair Display',serif",fontSize:16,color:C.navy,marginBottom:6}},cat));
      card.appendChild(el('p',{style:{color:C.grey,fontSize:13,marginBottom:12}},`${count} questions`));
      card.appendChild(el('div',{style:{background:C.red,color:C.white,borderRadius:8,padding:'7px 14px',fontSize:13,fontWeight:700,display:'inline-block'}},'Select →'));
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  } else if(ps.step==='province'){
    wrap.appendChild(el('h1',{style:{fontFamily:"'Playfair Display',serif",fontSize:28,color:C.navy,marginBottom:8}},'Choose Province Focus'));
    wrap.appendChild(el('p',{style:{color:C.grey,fontSize:14,marginBottom:16}},'Step 2: Choose a province to prioritize questions, or keep it as All of Canada.'));
    const grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))',gap:10,marginBottom:16}});
    PROVINCES.forEach(p=>{
      const isSelected=ps.selectedProvince===p.id;
      const card=el('div',{class:'card-hover',style:{background:isSelected?C.navy:C.white,borderRadius:10,padding:'12px 8px',textAlign:'center',border:'1px solid '+C.greyLight,cursor:'pointer'},onClick:()=>{practiceState.selectedProvince=p.id;render();}});
      card.appendChild(el('div',{style:{fontSize:22,marginBottom:4}},p.flag));
      card.appendChild(el('div',{style:{fontFamily:"'Playfair Display',serif",fontSize:12,fontWeight:700,color:isSelected?C.white:C.navy}},p.name));
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    const btns=el('div',{style:{display:'flex',gap:12,flexWrap:'wrap'}});
    btns.appendChild(el('button',{style:{background:'transparent',color:C.navy,border:'2px solid '+C.greyLight,padding:'10px 20px',borderRadius:10,fontSize:14,fontWeight:600,cursor:'pointer'},onClick:()=>{practiceState.step='category';render();}},'← Back'));
    btns.appendChild(el('button',{style:{background:C.red,color:C.white,border:'none',padding:'10px 24px',borderRadius:10,fontSize:14,fontWeight:700,cursor:'pointer'},onClick:()=>{practiceState.step='size';render();}},'Continue →'));
    wrap.appendChild(btns);
  } else if(ps.step==='size'){
    wrap.appendChild(el('h1',{style:{fontFamily:"'Playfair Display',serif",fontSize:28,color:C.navy,marginBottom:8}},'Choose Quiz Length'));
    wrap.appendChild(el('p',{style:{color:C.grey,fontSize:14,marginBottom:16}},'Step 3: How many questions do you want?'));
    const grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginBottom:20}});
    QUIZ_SIZES.forEach(s=>{
      const pool=getPool();
      const avail=Math.min(s.value,pool.length);
      const isSelected=ps.selectedSize===s.value;
      const card=el('div',{class:'card-hover',style:{background:isSelected?C.navy:C.white,borderRadius:14,padding:'20px',textAlign:'center',border:'2px solid '+(isSelected?C.red:C.greyLight),cursor:'pointer'},onClick:()=>{practiceState.selectedSize=s.value;render();}});
      card.appendChild(el('div',{style:{fontFamily:"'Playfair Display',serif",fontSize:28,color:isSelected?C.red:C.navy,fontWeight:700}},avail+''));
      card.appendChild(el('div',{style:{fontFamily:"'Playfair Display',serif",fontSize:15,color:isSelected?C.white:C.navy,marginTop:4}},s.label));
      card.appendChild(el('div',{style:{fontSize:12,color:isSelected?'rgba(255,255,255,0.6)':C.grey}},s.desc));
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    const btns=el('div',{style:{display:'flex',gap:12,flexWrap:'wrap'}});
    btns.appendChild(el('button',{style:{background:'transparent',color:C.navy,border:'2px solid '+C.greyLight,padding:'10px 20px',borderRadius:10,fontSize:14,fontWeight:600,cursor:'pointer'},onClick:()=>{practiceState.step='province';render();}},'← Back'));
    const startBtn=el('button',{style:{background:ps.selectedSize?C.red:C.greyLight,color:ps.selectedSize?C.white:C.grey,border:'none',padding:'10px 24px',borderRadius:10,fontSize:14,fontWeight:700,cursor:ps.selectedSize?'pointer':'default'},onClick:()=>{
      if(!ps.selectedSize)return;
      const pool=getPool();
      const count=Math.min(ps.selectedSize,pool.length);
      practiceState.questions=shuffle(pool).slice(0,count);
      quizState=null;
      practiceState.step='quiz';
      render();
    }},ps.selectedSize?`Start Quiz (${ps.selectedSize} Questions) →`:'Select a length above');
    btns.appendChild(startBtn);
    wrap.appendChild(btns);
  }
  return wrap;
}

function legalWrap(title, subtitle) {

  hdr.appendChild(el('p',{style:{color:C.grey,fontSize:14}},subtitle));
  wrap.appendChild(hdr);
  return wrap;
}
function legalSection(wrap, heading, ...paragraphs) {
  const sec = el('div', {style:{marginBottom:28}});
  if(heading) sec.appendChild(el('h2',{style:{fontFamily:"'Playfair Display',serif",fontSize:18,color:C.navy,marginBottom:10,marginTop:0}},heading));
  paragraphs.forEach(p=>{
    if(typeof p==='string'){
      sec.appendChild(el('p',{style:{color:'#2D3748',lineHeight:1.8,marginBottom:10,fontSize:15}},p));
    } else {
      sec.appendChild(p);
    }
  });
  wrap.appendChild(sec);
}

function renderContact() {
  const outer = el('div',{style:{minHeight:'80vh',display:'flex',alignItems:'stretch',flexWrap:'wrap'}});

  // ── LEFT PANEL ──
  const left = el('div',{style:{
    flex:'1',minWidth:280,background:'linear-gradient(160deg,'+C.navy+' 0%,#152340 60%,#1E3A5F 100%)',
    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
    padding:'48px 32px',gap:24
  }});
  const logoRow = el('div',{style:{display:'flex',alignItems:'center',gap:12,marginBottom:8}});
  logoRow.appendChild(mapleLeaf(44,C.red));
  logoRow.appendChild(el('span',{style:{fontFamily:"'Playfair Display',serif",fontSize:32,fontWeight:900,color:'#f0ede6'},
    html:"My<em style='font-style:normal;color:#D52B1E'>Citizen</em><br>Journey"}));
  left.appendChild(logoRow);
  left.appendChild(el('p',{style:{color:'rgba(240,237,230,0.6)',fontSize:15,textAlign:'center',lineHeight:1.7,maxWidth:260}},
    'Free Canadian citizenship test prep. Study guides, practice tests, and mock exams — all in one place.'));
  const badges = [['226','Questions'],['Free','Always'],['🍁','Canada']];
  const badgeRow = el('div',{style:{display:'flex',gap:12,flexWrap:'wrap',justifyContent:'center',marginTop:8}});
  badges.forEach(([n,l])=>{
    const b = el('div',{style:{background:'rgba(213,43,30,0.15)',border:'1px solid rgba(213,43,30,0.3)',borderRadius:20,padding:'6px 14px',textAlign:'center'}});
    b.appendChild(el('div',{style:{color:'#D52B1E',fontWeight:700,fontSize:15}},n));
    b.appendChild(el('div',{style:{color:'rgba(240,237,230,0.5)',fontSize:11}},l));
    badgeRow.appendChild(b);
  });
  left.appendChild(badgeRow);

  // ── RIGHT PANEL ──
  const right = el('div',{style:{
    flex:'1',minWidth:300,background:'#F2EFE9',
    display:'flex',flexDirection:'column',justifyContent:'center',
    padding:'48px 40px'
  }});
  right.appendChild(el('h1',{style:{fontFamily:"'Playfair Display',serif",fontSize:'clamp(24px,4vw,34px)',color:C.navy,marginBottom:8,fontWeight:900}},'Contact MyCitizenJourney'));
  right.appendChild(el('p',{style:{color:C.grey,fontSize:14,marginBottom:28,lineHeight:1.7}},
    'Questions, feedback, content suggestions, or error reports? Send us a message and we\'ll get back to you as soon as possible.'));

  function iStyle(extra={}){ return {width:'100%',padding:'11px 14px',borderRadius:8,border:'1.5px solid #ddd',fontSize:14,fontFamily:"'Source Sans 3',sans-serif",color:C.navy,background:'#fff',outline:'none',boxSizing:'border-box',...extra}; }
  function label(txt){ return el('div',{style:{fontWeight:700,fontSize:13,color:C.navy,marginBottom:6}},txt); }

  const nameInput    = el('input',{type:'text',name:'name',placeholder:'Your name',style:iStyle()});
  const emailInput   = el('input',{type:'email',name:'email',placeholder:'your@email.com',style:iStyle()});
  const msgInput     = el('textarea',{name:'message',placeholder:'Your message...',rows:5,style:iStyle({resize:'vertical'})});
  const submitBtn    = el('button',{type:'button',style:{marginTop:20,background:C.red,color:'#fff',border:'none',borderRadius:8,padding:'13px 28px',fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:"'Source Sans 3',sans-serif",width:'100%',transition:'background 0.2s'}},'Send Message');
  const successMsg   = el('div',{style:{display:'none',background:'#d4edda',border:'1px solid #c3e6cb',borderRadius:8,padding:'12px 16px',color:'#155724',fontSize:14,marginTop:12}},'✅ Message sent! We\'ll get back to you soon.');

  submitBtn.addEventListener('mouseover',()=>submitBtn.style.background=C.redDark);
  submitBtn.addEventListener('mouseout',()=>submitBtn.style.background=C.red);
  submitBtn.addEventListener('click', async ()=>{
    const name=nameInput.value.trim(), email=emailInput.value.trim(), message=msgInput.value.trim();
    if(!name||!email||!message){alert('Please fill in all fields.');return;}
    submitBtn.textContent='Sending...'; submitBtn.disabled=true;
    try {
      const res = await fetch('https://formspree.io/f/xkoazoqv',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name,email,message})});
      if(res.ok){
        successMsg.style.display='block';
        nameInput.value=''; emailInput.value=''; msgInput.value='';
        submitBtn.textContent='Sent ✓';
      } else { submitBtn.textContent='Send Message'; submitBtn.disabled=false; alert('Something went wrong. Please try again.'); }
    } catch(e){ submitBtn.textContent='Send Message'; submitBtn.disabled=false; alert('Something went wrong. Please try again.'); }
  });

  [
    label('Name'), nameInput,
    el('div',{style:{marginTop:14}}),
    label('Email'), emailInput,
    el('div',{style:{marginTop:14}}),
    label('Message'), msgInput,
    submitBtn, successMsg
  ].forEach(e=>right.appendChild(e));

  outer.appendChild(left);
  outer.appendChild(right);
  return outer;
}
